<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>无法连接</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1020;color:#e6ebff;font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;text-align:center}
  .box{padding:24px;max-width:420px}
  .ring{width:96px;height:96px;margin:0 auto 18px;border:2px solid #3b5bdb;border-radius:50%;position:relative}
  .ring::after{content:"";position:absolute;top:-6px;left:44px;width:10px;height:10px;border-radius:50%;background:#5eead4}
  h1{margin:0 0 8px;font-size:24px}
  p{margin:0 0 20px;color:#aab6d3;line-height:1.8}
  button{padding:10px 26px;border:0;border-radius:10px;background:#8fa8ff;color:#0b1020;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="ring"></div>
    <h1>无法连接到网站</h1>
    <p>请检查网络连接。联网后会自动重试，也可以手动点击下面的按钮。</p>
    <button onclick="retry()">重新连接</button>
  </div>
<script>
  var SITE = 'https://reog163.github.io';
  function retry() { location.href = SITE; }
  setInterval(function () { if (navigator.onLine) retry(); }, 5000);
</script>
</body>
</html>
